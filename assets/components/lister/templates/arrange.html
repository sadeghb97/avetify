<div class="modal"
     style="
        width: 480px;
        max-width: calc(100vw - 40px);
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0,0,0,.2);
        overflow: hidden;
        font-family: sans-serif;
     ">

    <div style="
        padding: 20px 24px;
        border-bottom: 1px solid #eee;
    ">
        <h2 style="
            margin: 0;
            font-size: 20px;
            color: #222;
        ">
            Select Items
        </h2>
    </div>


    <div style="
        padding: 20px 24px;
        min-height: 150px;
    ">

        <div class="content-container"
             style="
                display: flex;
                flex-direction: column;
                gap: 10px;
             ">

        </div>

    </div>


    <div style="
        padding: 16px 24px;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    ">

        <button class="cancel"
                style="
                    padding: 8px 18px;
                    border-radius: 6px;
                    border: 1px solid #ddd;
                    background: #f5f5f5;
                    cursor: pointer;
                ">
            Cancel
        </button>


        <button class="apply"
                style="
                    padding: 8px 18px;
                    border-radius: 6px;
                    border: none;
                    background: #2563eb;
                    color: white;
                    cursor: pointer;
                ">
            Apply
        </button>

    </div>

</div>
